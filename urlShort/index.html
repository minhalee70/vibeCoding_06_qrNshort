<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="스마트 URL 단축기 - 긴 주소를 무료 오픈 API로 쉽고 빠르게 단축하세요.">
  <title>URL 단축 - 스마트 툴박스</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Glowing Orbs -->
  <div class="bg-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="../index.html" class="back-home-link" id="backToHomeBtn" title="메인 대문으로 돌아가기">
          <i class="fa-solid fa-arrow-left"></i>
          <span>뒤로가기</span>
        </a>
        <div class="brand-info">
          <span class="brand-name">URL Shortener</span>
          <span class="brand-badge">FREE</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- HERO Header -->
      <section class="url-hero">
        <h1 class="main-title">스마트 URL 단축기</h1>
        <p class="main-subtitle">길고 복잡한 주소를 입력하고 짧은 URL을 생성하세요</p>
      </section>

      <!-- URL Shortener Card -->
      <section class="url-card">
        <form id="shortenForm" onsubmit="return false;">
          <!-- Input Group -->
          <div class="input-field-wrapper">
            <label for="urlInput" class="input-label">단축할 원본 URL</label>
            <div class="input-container">
              <i class="fa-solid fa-link input-icon"></i>
              <input 
                type="text" 
                id="urlInput" 
                class="url-input" 
                placeholder="단축할 URL을 입력하세요 (https://...)" 
                autocomplete="off"
              >
              <button type="button" id="clearBtn" class="clear-btn" style="display: none;" title="입력 지우기">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="action-row">
            <button type="submit" id="shortenBtn" class="btn-primary" disabled>
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>단축하기</span>
            </button>
          </div>
        </form>

        <!-- Loading State -->
        <div id="loadingBox" class="loading-box" style="display: none;">
          <div class="spinner"></div>
          <p class="loading-text">단축 URL 생성 중입니다...</p>
        </div>

        <!-- Result Box (ReadOnly Output + Copy Button) -->
        <div id="resultBox" class="result-box" style="display: none;">
          <div class="result-header">
            <span class="result-title"><i class="fa-solid fa-circle-check"></i> 단축 완료!</span>
          </div>

          <div class="output-container">
            <input 
              type="text" 
              id="shortUrlOutput" 
              class="short-url-output" 
              readonly 
              placeholder="단축된 URL이 여기에 나타납니다"
            >
            <button type="button" id="copyBtn" class="btn-copy">
              <i class="fa-regular fa-copy"></i>
              <span id="copyBtnText">복사</span>
            </button>
          </div>

          <div class="result-actions">
            <a id="openShortUrlBtn" href="#" target="_blank" class="btn-open-link">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              <span>새 탭에서 생성된 링크 열기</span>
            </a>
          </div>
        </div>
      </section>

      <!-- History Section -->
      <section id="historySection" class="history-section" style="display: none;">
        <div class="history-header">
          <h3><i class="fa-solid fa-clock-rotate-left"></i> 최근 단축 기록</h3>
          <button id="clearHistoryBtn" class="btn-clear-history">전체 삭제</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2026 스마트 툴박스 | URL Shortener</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
