<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="긴 URL을 짧고 기억하기 쉬운 단축 URL로 즉시 전환하고 공유하세요.">
  <title>URL Shortener - 스마트 URL 단축기</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Glowing Orbs -->
  <div class="bg-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    <!-- Header Navigation -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-wrapper">
          <i class="fa-solid fa-link-sharp brand-logo-icon"></i>
        </div>
        <div class="brand-info">
          <span class="brand-name">URL Shortener</span>
          <span class="brand-badge">FAST</span>
        </div>
      </div>
      
      <!-- Nav Tabs: QR코드 vs URL단축 -->
      <nav class="nav-tabs">
        <a href="../url2qr/index.html" class="nav-tab">
          <i class="fa-solid fa-qrcode"></i>
          <span>QR코드</span>
        </a>
        <a href="../urlShort/index.html" class="nav-tab active">
          <i class="fa-solid fa-link-slash"></i>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-right">
        <button id="resetBtn" class="header-btn" title="새로 만들기">
          <i class="fa-solid fa-rotate"></i>
          <span>초기화</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- HERO & INPUT SECTION -->
      <section class="shortener-section">
        <div class="hero-header">
          <div class="icon-badge">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <h1 class="main-title">스마트 URL 단축 서비스</h1>
          <p class="main-subtitle">긴 주소를 깔끔한 단축 링크로 변환하고 클릭 한 번으로 복사하세요</p>
        </div>

        <!-- URL Shorten Card -->
        <div class="shortener-card">
          <form id="shortenForm" class="shorten-form" onsubmit="return false;">
            <!-- URL 입력창 (Requirement 3-1 & 3-2) -->
            <div class="input-group">
              <label for="urlInput" class="input-label">
                <i class="fa-solid fa-link"></i> 단축할 원본 URL 입력
              </label>
              <div class="input-wrapper">
                <input 
                  type="text" 
                  id="urlInput" 
                  class="url-input" 
                  placeholder="https://example.com/very-long-link-address" 
                  autocomplete="off"
                  spellcheck="false"
                />
                <button type="button" id="clearBtn" class="clear-btn" title="입력 내용 지우기" style="display: none;">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>

            <!-- 단축하기 버튼 (Requirement 3-1 & 3-2: 기본 비활성화) -->
            <button type="submit" id="shortenBtn" class="shorten-btn" disabled>
              <i class="fa-solid fa-scissors"></i>
              <span>단축하기</span>
            </button>
          </form>

          <!-- Loading Indicator -->
          <div id="loadingBox" class="loading-box" style="display: none;">
            <div class="spinner"></div>
            <span>OpenAPI로 URL 단축 요청 중...</span>
          </div>

          <!-- Result Card Output Area (Requirement 3-1 & 3-4) -->
          <div id="resultBox" class="result-box" style="display: none;">
            <div class="result-header">
              <span class="result-title"><i class="fa-solid fa-circle-check"></i> 단축 완료된 URL</span>
              <span class="api-badge" id="apiBadge">OpenAPI</span>
            </div>

            <div class="output-wrapper">
              <!-- 읽기 전용 출력 상자 (Requirement 3-1) -->
              <input 
                type="text" 
                id="outputUrl" 
                class="output-input" 
                readonly 
                placeholder="단축된 URL이 여기에 표시됩니다." 
              />
              
              <!-- 복사 버튼 (Requirement 3-4) -->
              <button type="button" id="copyBtn" class="copy-btn">
                <i class="fa-regular fa-copy"></i>
                <span>복사</span>
              </button>
            </div>

            <!-- Additional Useful Action Buttons -->
            <div class="result-actions">
              <a id="openLinkBtn" href="#" target="_blank" class="action-btn btn-secondary">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> 새 창에서 열기
              </a>
              <button type="button" id="createQrBtn" class="action-btn btn-accent">
                <i class="fa-solid fa-qrcode"></i> 이 단축주소로 QR 생성
              </button>
            </div>
          </div>
        </div>

        <!-- Quick Samples / Suggestions -->
        <div class="url-suggestions">
          <span class="suggestion-label">샘플 테스트:</span>
          <button type="button" class="tag-btn" data-url="https://github.com/google/antigravity-ide">GitHub Antigravity</button>
          <button type="button" class="tag-btn" data-url="https://news.naver.com/main/main.naver?mode=LSD&mid=shm&sid1=105">Naver IT News</button>
          <button type="button" class="tag-btn" data-url="https://www.youtube.com/watch?v=dQw4w9WgXcQ">YouTube Video</button>
        </div>

        <!-- History Card -->
        <div class="history-card" id="historyCard" style="display: none;">
          <div class="history-header">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> 최근 단축 내역</h3>
            <button type="button" id="clearHistoryBtn" class="text-btn">내역 지우기</button>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2026 URL Shortener Service. OpenAPI 기반 스마트 URL 단축 및 QR 코드 통합 솔루션</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
