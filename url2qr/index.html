<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="URL을 입력하여 빠르고 쉽게 고품질 QR 코드를 생성하고 JPG 파일로 다운로드하세요.">
  <title>QR Craft - 스마트 QR 코드 생성기</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Glowing Orbs -->
  <div class="bg-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    <!-- Header: Logo & Nav Tabs -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-wrapper">
          <img src="img/logo.png" alt="로고" class="header-logo" id="appLogo">
        </div>
        <div class="brand-info">
          <span class="brand-name">QR Craft</span>
          <span class="brand-badge">PRO</span>
        </div>
      </div>
      
      <nav class="nav-tabs">
        <a href="../url2qr/index.html" class="nav-tab active">
          <i class="fa-solid fa-qrcode"></i>
          <span>QR코드</span>
        </a>
        <a href="../urlShort/index.html" class="nav-tab">
          <i class="fa-solid fa-link-slash"></i>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-right">
        <button id="resetBtn" class="header-btn" title="새로 만들기" style="display: none;">
          <i class="fa-solid fa-arrow-rotate-left"></i>
          <span>새 QR 생성</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- CENTER STAGE: QR Code Display Card (Appears in center when generated) -->
      <section class="qr-display-section" id="qrDisplaySection">
        <div class="qr-card-wrapper" id="qrCardWrapper">
          <div class="card-corner corner-tl"></div>
          <div class="card-corner corner-tr"></div>
          <div class="card-corner corner-bl"></div>
          <div class="card-corner corner-br"></div>
          
          <div class="scan-line"></div>

          <!-- Clickable QR Code Output Box -->
          <div class="qr-box" id="qrBox" title="클릭하여 JPG 파일로 다운로드">
            <div id="qrcodeCanvas"></div>
            
            <!-- Hover Overlay for Download -->
            <div class="qr-hover-overlay">
              <div class="download-badge">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>JPG 다운로드</span>
              </div>
            </div>
          </div>

          <div class="qr-meta">
            <div class="qr-target-url" id="displayUrlText">https://example.com</div>
            <p class="qr-hint">
              <i class="fa-solid fa-hand-pointer"></i> 
              <strong>QR 코드를 클릭</strong>하면 <span class="highlight-jpg">JPG 파일</span>로 바로 다운로드됩니다.
            </p>
          </div>

          <!-- Quick Action Buttons under Center QR -->
          <div class="qr-actions">
            <button id="downloadJpgBtn" class="action-btn btn-primary">
              <i class="fa-solid fa-download"></i> JPG 다운로드
            </button>
            <button id="copyImageBtn" class="action-btn btn-secondary">
              <i class="fa-regular fa-copy"></i> 이미지 복사
            </button>
            <button id="openUrlBtn" class="action-btn btn-outline" target="_blank">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> 링크 이동
            </button>
          </div>
        </div>
      </section>

      <!-- HERO / INPUT SECTION: URL Input Bar (Starts in Center, Moves Down upon Submit) -->
      <section class="url-input-section" id="urlInputSection">
        <div class="input-hero-header" id="inputHeroHeader">
          <h1 class="main-title">스마트 QR 코드 생성기</h1>
          <p class="main-subtitle">원하는 URL을 입력하고 나만의 QR 코드를 즉시 생성하세요</p>
        </div>

        <form id="qrForm" class="url-form" onsubmit="return false;">
          <div class="input-wrapper">
            <div class="input-icon">
              <i class="fa-solid fa-link"></i>
            </div>
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="https:// example.com 또는 웹사이트 주소 입력" 
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="button" id="clearBtn" class="clear-btn" title="입력 내용 지우기">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <button type="submit" id="submitBtn" class="submit-btn">
              <span>확인</span>
              <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
          </div>
          <div class="input-validation-msg" id="validationMsg"></div>
        </form>

        <!-- Quick URL Suggestions / Tags -->
        <div class="url-suggestions" id="urlSuggestions">
          <span class="suggestion-label">빠른 테스트:</span>
          <button type="button" class="tag-btn" data-url="https://www.google.com">Google</button>
          <button type="button" class="tag-btn" data-url="https://www.naver.com">Naver</button>
          <button type="button" class="tag-btn" data-url="https://www.youtube.com">YouTube</button>
          <button type="button" class="tag-btn" data-url="https://github.com">GitHub</button>
        </div>
      </section>
    </main>

    <!-- Footer Info -->
    <footer class="app-footer">
      <p>© 2026 QR Craft. 모든 QR 코드는 고화질 JPG 이미지로 저장됩니다.</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- QRCode Library -->
  <script src="js/qrcode.min.js"></script>
  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
