<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="스마트 툴박스 - QR코드 생성 및 URL 단축 서비스를 제공하는 파스텔 톤 웹 스마트 툴">
  <title>스마트 툴박스 - Smart Toolbox</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Glowing Orbs -->
  <div class="bg-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-badge-main">
          <i class="fa-solid fa-toolbox"></i>
        </div>
        <div class="brand-info">
          <span class="brand-name">스마트 툴박스</span>
          <span class="brand-sub">Smart Toolbox</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="hero-section">
        <h1 class="main-title">스마트 툴박스</h1>
        <p class="main-subtitle">원하는 기능을 선택해주세요</p>
      </div>

      <!-- Vertical Card Shortcut Buttons -->
      <div class="toolbox-cards">
        <!-- Card 1: QR코드 생성 -->
        <a href="./url2qr/index.html" class="tool-card card-qr" id="qrCardBtn">
          <div class="card-glow-bg"></div>
          <div class="card-icon-wrapper icon-purple">
            <i class="fa-solid fa-qrcode"></i>
          </div>
          <div class="card-body">
            <div class="card-title-group">
              <h2 class="card-title">QR코드 생성</h2>
              <span class="card-tag tag-purple">QR Craft</span>
            </div>
            <p class="card-desc">웹 URL을 고화질 QR 코드로 즉시 변환하고 JPG 이미지로 다운로드하세요.</p>
          </div>
          <div class="card-arrow">
            <span>시작하기</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </a>

        <!-- Card 2: URL 단축 -->
        <a href="./urlShort/index.html" class="tool-card card-url" id="urlShortCardBtn">
          <div class="card-glow-bg"></div>
          <div class="card-icon-wrapper icon-pink">
            <i class="fa-solid fa-scissors"></i>
          </div>
          <div class="card-body">
            <div class="card-title-group">
              <h2 class="card-title">URL 단축</h2>
              <span class="card-tag tag-pink">Shortener</span>
            </div>
            <p class="card-desc">복잡하고 긴 웹주소를 클릭 한 번으로 간편하고 깔끔하게 단축하세요.</p>
          </div>
          <div class="card-arrow">
            <span>시작하기</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2026 스마트 툴박스 | Smart Toolbox</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
